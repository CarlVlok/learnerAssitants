<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Start Session</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .container { max-width: 400px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 8px; }
        label { display: block; margin-top: 10px; }
        input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; padding: 8px 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Start Your Study Session</h2>
        <form method="post">
            <label for="user">Session Name:</label>
            <input type="text" id="user" name="user" required>
            <label for="module">Module Name:</label>
            <input type="text" id="module" name="module" required>
            <button type="submit">Start Chat</button>
        </form>
    </div>
</body>
</html>
