<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Assistant Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .chat-container { max-width: 600px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 8px; }
        .chat-bubble { margin: 10px 0; padding: 10px 15px; border-radius: 20px; max-width: 80%; }
        .user { background: #d1e7dd; align-self: flex-end; }
        .bot { background: #f8d7da; align-self: flex-start; }
        .chat-history { display: flex; flex-direction: column; }
        form { margin-top: 20px; }
        label { display: block; margin-top: 10px; }
        input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 10px; padding: 8px 16px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>Study Assistant Chat</h1>
        <p><strong>Session:</strong> {{ user }} | <strong>Module:</strong> {{ module }}</p>
        <div class="chat-history">
            {% for item in chat_history %}
                <div class="chat-bubble user"><strong>You:</strong> {{ item.question }}</div>
                <div class="chat-bubble bot"><strong>Bot:</strong> {{ item.answer }}</div>
            {% endfor %}
        </div>
        <form method="post">
            <label for="prompt">Your Question:</label>
            <input type="text" id="prompt" name="prompt" required>
            <button type="submit">Ask</button>
        </form>
    </div>
</body>
</html>
